<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <title>CryptoMoon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f2eb;
        color: #1f1f1f;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .boot-card {
        display: grid;
        gap: 12px;
        text-align: center;
        padding: 24px 28px;
        border-radius: 18px;
        background: #ffffff;
        border: 1px solid #e6e1d7;
        box-shadow: 0 12px 30px rgba(15, 15, 15, 0.08);
      }
      .boot-title {
        font-family: "Fraunces", serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
      .boot-sub {
        font-size: 14px;
        color: #6b6b6b;
      }
      .boot-bar {
        width: 220px;
        height: 6px;
        border-radius: 999px;
        background: #efe8da;
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: #f0b429;
        border-radius: 999px;
        animation: boot-move 1.2s ease-in-out infinite;
      }
      @keyframes boot-move {
        0% { transform: translateX(-10%); }
        50% { transform: translateX(160%); }
        100% { transform: translateX(-10%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-card">
          <div class="boot-title">CryptoMoon</div>
          <div class="boot-sub">Warming up the dashboard...</div>
          <div class="boot-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
